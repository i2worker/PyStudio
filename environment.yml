name: pystudio
channels:
  - conda-forge
  - defaults
channel_priority: strict
dependencies:
  # 基础依赖
  - python=3.12
  - pip>=26.0.0

  # 交互环境依赖
  - notebook>=7.5.0

  # 数据分析依赖
  - pandas>=3.0.0
  - numpy>=2.4.0

  # 数据可视化依赖
  - matplotlib>=3.10.0
  - seaborn>=0.13.0
  - bokeh>=3.9.0
  - plotly>=6.6.0

  # 数据统计依赖
  - statsmodels>=0.14.0
  - scipy>=1.17.0

  # 机器学习依赖
  - scikit-learn>=1.8.0

  # 网页解析依赖
  - requests>=2.32.0
  - beautifulsoup4>=4.12.0
  - html5lib>=1.0.0
  - lxml>=6.0.0

  # Excel处理依赖
  - xlsxwriter>=3.2.0
  - xlrd>=2.0.0
  - openpyxl>=3.1.0
